name: Build FitDownloader EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda z Python 3.12
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          activate-environment: fitenv
          auto-activate-base: false

      - name: Install libtorrent przez conda
        run: conda install -c conda-forge libtorrent -y

      - name: Install pozostałe zależności
        run: pip install flask httpx requests beautifulsoup4 rarfile pyinstaller

      - name: Verify libtorrent
        run: python -c "import libtorrent; print('libtorrent OK:', libtorrent.version)"

      - name: Build EXE
        run: |
          pyinstaller --onefile --console \
            --hidden-import flask \
            --hidden-import werkzeug \
            --hidden-import werkzeug.serving \
            --hidden-import jinja2 \
            --hidden-import jinja2.ext \
            --hidden-import markupsafe \
            --hidden-import click \
            --hidden-import itsdangerous \
            --hidden-import httpx \
            --hidden-import httpcore \
            --hidden-import h11 \
            --hidden-import certifi \
            --hidden-import charset_normalizer \
            --hidden-import idna \
            --hidden-import urllib3 \
            --hidden-import requests \
            --hidden-import bs4 \
            --hidden-import bs4.builder \
            --hidden-import rarfile \
            --collect-all libtorrent \
            --hidden-import threading \
            --hidden-import webbrowser \
            --name FitDownloader \
            app_entry.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FitDownloader-Windows
          path: dist/FitDownloader.exe
          retention-days: 30
