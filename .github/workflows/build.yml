name: Build FitDownloader EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask httpx requests beautifulsoup4 rarfile pyinstaller

      - name: Install libtorrent + brakujące DLL
        run: |
          pip install libtorrent
          pip install libtorrent-windows-dll

      - name: Verify libtorrent
        run: python -c "import libtorrent; print('libtorrent OK:', libtorrent.version)"

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --onefile --console `
            --hidden-import flask `
            --hidden-import werkzeug `
            --hidden-import werkzeug.serving `
            --hidden-import jinja2 `
            --hidden-import jinja2.ext `
            --hidden-import markupsafe `
            --hidden-import click `
            --hidden-import itsdangerous `
            --hidden-import httpx `
            --hidden-import httpcore `
            --hidden-import h11 `
            --hidden-import certifi `
            --hidden-import charset_normalizer `
            --hidden-import idna `
            --hidden-import urllib3 `
            --hidden-import requests `
            --hidden-import bs4 `
            --hidden-import bs4.builder `
            --hidden-import rarfile `
            --collect-all libtorrent `
            --hidden-import threading `
            --hidden-import webbrowser `
            --name FitDownloader `
            app_entry.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FitDownloader-Windows
          path: dist/FitDownloader.exe
          retention-days: 30
